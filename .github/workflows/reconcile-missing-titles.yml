name: Reconcile missing titles

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile published catalog titles
        env:
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_JOB_TOKEN: ${{ secrets.CATALOG_JOB_TOKEN }}
        run: |
          if [ -z "$CATALOG_API_URL" ] || [ -z "$CATALOG_JOB_TOKEN" ]; then
            echo "Catalog reconciliation is not configured; skipping."
            exit 0
          fi
          curl --fail --show-error --silent --retry 3 \
            --request POST \
            --header "Authorization: Bearer $CATALOG_JOB_TOKEN" \
            "$CATALOG_API_URL/api/internal/reconcile"
